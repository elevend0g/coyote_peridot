const KEY="base10-combat-tracker-v1";
const sheet=document.getElementById("sheet"),status=document.getElementById("status");
const els={};
for(const f of FIELDS){
  const i=document.createElement("input");
  i.type=f.t==="c"?"checkbox":"text"; if(f.t==="h"){i.classList.add("hex");i.maxLength=3;i.spellcheck=false;}
  i.name=f.n; i.id="f_"+f.n;
  if(f.t==="h")i.placeholder=" ";
  i.setAttribute("aria-label",f.l||f.n.replace(/_/g," "));
  if(f.l) i.title=f.l;
  const s=i.style;
  s.left=f.x+"%"; s.top=f.y+"%"; s.width=f.w+"%"; s.height=f.h+"%";
  if(f.t!=="c"){ s.fontSize=(f.fs*1.05/792*100)+"cqw"; if(f.c) i.classList.add("ctr"); }
  sheet.appendChild(i); els[f.n]=i;
}
function collect(){const o={};for(const n in els){const e=els[n];if(e.type==="checkbox"){if(e.checked)o[n]=true}else if(e.value)o[n]=e.value}return o}
function apply(o){for(const n in els){const e=els[n];if(e.type==="checkbox")e.checked=!!o[n];else e.value=o[n]??""}}
function flash(t){status.textContent=t;clearTimeout(flash.t);flash.t=setTimeout(()=>status.textContent="",1800)}
let timer;
function autosave(){clearTimeout(timer);timer=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(collect()));flash("Saved")}catch(e){}},400)}
sheet.addEventListener("input",autosave);
try{const s=localStorage.getItem(KEY);if(s)apply(JSON.parse(s))}catch(e){}
function charName(){const v=Object.entries(collect()).find(([k])=>k==="character");return (v?v[1]+"_combat":"combat_tracker").trim().replace(/[^\w\- ]+/g,"").replace(/\s+/g,"_")||"character"}
document.getElementById("save").onclick=()=>{
  const blob=new Blob([JSON.stringify({sheet:"Base10 Combat Tracker",version:1,fields:collect()},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=charName()+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
const picker=document.getElementById("picker");
document.getElementById("load").onclick=()=>picker.click();
picker.onchange=async()=>{const f=picker.files[0];if(!f)return;try{const d=JSON.parse(await f.text());apply(d.fields||d);autosave();flash("Loaded")}catch(e){flash("Not a sheet file")}picker.value=""};
document.getElementById("clearmap").onclick=()=>{const b=document.getElementById("clearmap");if(!b.dataset.arm){b.dataset.arm=1;flash("Click again to clear map");setTimeout(()=>delete b.dataset.arm,3000);return}delete b.dataset.arm;for(const n in els)if(n.startsWith("hex_"))els[n].value="";autosave();flash("Map cleared")};
document.getElementById("print").onclick=()=>window.print();
document.getElementById("clear").onclick=()=>{if(!sheet.dataset.arm){sheet.dataset.arm=1;flash("Click Clear again to erase");setTimeout(()=>delete sheet.dataset.arm,3000);return}delete sheet.dataset.arm;apply({});autosave();flash("Cleared")};
